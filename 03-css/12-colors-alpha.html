    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      div.mario {
        background: url(imgs/mario.png) no-repeat center;
        background-size: cover;
        width: 316px;
        margin: 0 auto;
        overflow: hidden;
        height: 440px;
        div {
          height: calc(440px / 3);
          border-bottom: 8px solid #0009;
          &:last-of-type {
            border-bottom: none;
          }
          &.box1 {
            background-color: #fffc;
          }
          &.box2 {
            background-color: rgba(255, 255, 255, 0.533);
          }
          &.box3 {
            background-color: hsl(0, 0%, 100%, 0.267);
          }
        }
      }
    </style>
