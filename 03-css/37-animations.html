<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>37-Animations</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        div.jungle {
          background: url(imgs/jungle.png) no-repeat center / contain;
          margin: 0 auto;
          height: 390px;
          position: relative;
          width: 320px;

          img.logo {
            position: absolute;
            transform: scale(0.5);
            animation: 2.8s animLogo ease-in infinite;
            top: 10px;
          }

          img.dk {
            position: absolute;
            left: 90px;
            top: 140px;
            width: 140px;
            animation: 2s animDK ease infinite;
          }
        }
      }

      @keyframes animLogo {
        0%,
        100% {
          transform: scale(0.5);
        }
        50% {
          transform: scale(1);
        }
      }

      @keyframes animDK {
        0% {
          transform: translateY(-80px) rotateX(0deg);
        }
        40% {
          transform: translateY(-80px) rotateX(0deg);
        }
        50% {
          transform: translateY(-80px) rotateX(180deg);
        }
        60% {
          transform: translateY(-80px) rotateX(0deg);
        }
        100% {
          transform: translateY(0px) rotateX(0deg);
        }
      }
    </style>
  </head>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>37 - Animatios</h1>
        <h3>Lets an element gradually change from one style to another.</h3>
      </header>
      <section>
        <div class="jungle">
          <img src="imgs/logo-dk.png" class="logo" />
          <img src="imgs/dk.png" class="dk" />
          <div class="move">
            <img src="imgs/ryno.png" class="ryno" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
