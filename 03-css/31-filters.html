<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>31-Filters</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        img {
          height: 400px;
          display: block;
          margin-inline: auto;
          width: 392px;
        }

        .img:hover {
          filter: none;
        }

        .filter1 {
          filter: blur(2rem);
        }

        .filter2 {
          filter: grayscale(1);
        }

        .filter3 {
          filter: contrast(50%);
        }

        .filter4 {
          filter: drop-shadow(30px 10px 4px #4444dd);
        }
      }
    </style>
  </head>

      <section>
        <h4>Filter Blur:</h4>
        <img class="img filter1" src="imgs/popeye.png" />
