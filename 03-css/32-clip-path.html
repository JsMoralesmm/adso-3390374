<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>32-Clip-Path</title>
    <link rel="stylesheet" href="../src/css/master.css" />
  </head>
  <style>
    section {
      div.clip {
        background: url(imgs/pittsburgh.jpg) no-repeat center / cover;
        border-radius: 14px;
        corner-shape: squircle;
        margin: 0 auto;
        height: 300px;
        transition: all 0.4s ease-in;
        width: 300px;

        &.clip1 {
          clip-path: polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            82% 95%,
            50% 70%,
            19% 94%,
            32% 57%,
            2% 35%,
            39% 35%
          );
          &:hover {
            clip-path: polygon(
              50% 0%,
              100% 0,
              100% 35%,
              100% 64%,
              100% 100%,
              51% 100%,
              0 100%,
              0 75%,
              0 35%,
              0 0
            );
          }
        }

        &.clip2 {
          clip-path: polygon(
            0 25%,
            0 0,
            35% 0%,
            65% 0%,
            100% 0,
            100% 26%,
            100% 51%,
            100% 100%,
            65% 100%,
            35% 100%,
            0 100%,
            0 50%
          );

          &:hover {
            clip-path: polygon(
              10% 25%,
              35% 25%,
              35% 0%,
              65% 0%,
              65% 25%,
              90% 25%,
              90% 50%,
              65% 50%,
              65% 100%,
              35% 100%,
              35% 50%,
              10% 50%
            );
          }
        }
      }
    }
  </style>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>32 - Clip Path</h1>
        <h3>Property lets you clip an element to a basic shape</h3>
      </header>
      <section>
        <h4>Ejemplo 1:</h4>
        <div class="clip clip1"></div>
        <h4>Ejemplo 2:</h4>
        <div class="clip clip2"></div>
      </section>
    </main>
  </body>
</html>
