<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>26-Border-Radius</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        div {
          background-color: blueviolet;
          border: 4px solid white;
          display: 380px;
          margin: 0 auto;
          height: 200px;
          width: 200px;
          &.bradius1 {
            border-radius: 50%;
          }
          &.bradius2 {
            border-radius: 40px 0;
          }
          &.bradius3 {
            border-radius: 140px 0 0 140px;
          }
          &.bradius4 {
            border-radius: 140px 0 140px 140px;
          }
          &.bradius5 {
            border-radius: 40px;
            corner-shape: squircle;
          }
        }
      }
    </style>
  </head>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>26 - Border Radius</h1>
        <h3>Property defines the radius of the element's corners.</h3>
      </header>
      <section>
        <h4>border-radius: 50%</h4>
        <div class="bradius1"></div>
        <h4>border-radius: 40px 0</h4>
        <div class="bradius2"></div>
        <h4>border-radius: 140px 0 0 140px</h4>
        <div class="bradius3"></div>
        <h4>border-radius: 140px 0 140px 140px</h4>
        <div class="bradius4"></div>
        <h4>Corner-Shape:squircle</h4>
        <div class="bradius5"></div>
      </section>
    </main>
  </body>
</html>
