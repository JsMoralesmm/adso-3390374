<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>27-Box-Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        div.box {
          border: 2px solid #fff;
          height: 160px;
          margin: 2rem auto;
          width: 280px;
          &.box1 {
            box-shadow: 0 0 12px #fff;
          }
          &.box2 {
            box-shadow: -10px -10px 24px 0 #fff;
          }
          &.box3 {
            box-shadow: 0 0 20px #fff inset;
          }
          &.box4 {
            box-shadow:
              0 0 0 6px #ffcd00,
              12px 12px 0 6px #003087,
              18px 18px 0 6px #c8102e;
          }
        }
        div.images {
          text-align: center;
          margin-left: 1rem;
          img {
            width: 150px;
            &:first-child {
              box-shadow: 0 0 18px red inset;
            }
            &:last-child {
              filter: drop-shadow(0 0 10px red);
            }
          }
        }
      }
    </style>
  </head>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>27 - Box Shadow</h1>
        <h3>Property attaches one or more shadows to an element.</h3>
      </header>
      <section>
        <h4>box-shadow: 0 0 12px #fff</h4>
        <div class="box box1"></div>
        <h4>box-shadow: -10px -10px 24px 0 #fff</h4>
        <div class="box box2"></div>
        <h4>box-shadow: 0 0 20px #fff inset</h4>
        <div class="box box3"></div>
        <h4>box-shadow: multiple</h4>
        <div class="box box4"></div>
        <h4>box-shadow VS drop-shadow()</h4>
        <div class="images">
          <img src="imgs/mario.png" />
          <img src="imgs/mario.png" />
        </div>
      </section>
    </main>
  </body>
</html>
