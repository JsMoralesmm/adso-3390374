<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>31-Filters</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        img.filter {
          background: linear-gradient(45deg, red 50%, darkblue 50%);
          border-radius: 14px;
          outline: 2px solid #fff;
          display: block;
          corner-shape: squircle;
          margin: 1rem auto;
          padding: 0.4rem;
          transition: all 0.2s ease-in;
          width: 392px;

          &.filter1 {
            filter: grayscale(1);
          }

          &.filter2 {
            filter: blur(15px);
          }

          &.filter3 {
            filter: sepia(0.83);
          }

          &.filter4 {
            filter: brightness(0.4);
          }

          &.filter5 {
            filter: invert();
          }

          &.filter6 {
            filter: drop-shadow(0 0 20px #fff);
          }

          &.filter7 {
            filter: hue-rotate(200deg);
          }

          &:hover {
            filter: none;
          }
        }
      }
    </style>
  </head>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>31 - Filters</h1>
        <h3>
          Defines visual effects (blur, grayscale, constrast, drop-shadow).
        </h3>
      </header>
      <section>
        <h4>GrayScale</h4>
        <img class="filter filter1" src="imgs/popeye.png" alt="popeye" />
        <h4>Blur</h4>
        <img class="filter filter2" src="imgs/popeye.png" alt="popeye" />
        <h4>Sepia</h4>
        <img class="filter filter3" src="imgs/popeye.png" alt="popeye" />
        <h4>Brightness</h4>
        <img class="filter filter4" src="imgs/popeye.png" alt="popeye" />
        <h4>Invert</h4>
        <img class="filter filter5" src="imgs/popeye.png" alt="popeye" />
        <h4>Drop Shadow</h4>
        <img class="filter filter6" src="imgs/popeye.png" alt="popeye" />
        <h4>HUE Rotate</h4>
        <img class="filter filter7" src="imgs/popeye.png" alt="popeye" />
      </section>
    </main>
  </body>
</html>
